<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
  <title>밑줄서재</title>
  <meta name="description" content="책에 쓰지 않고 긋는 밑줄 — 글귀, 쪽수, 인물 관계도를 3D 책장에 정리해요">
  <meta name="theme-color" content="#2b2622">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="밑줄서재">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&display=swap">
  <link rel="stylesheet" href="style.css">
  <script type="importmap">
    { "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js" } }
  </script>
</head>
<body>
  <div id="stage"></div>

  <header id="topbar">
    <div class="brand">밑줄<span>서재</span></div>
    <div class="actions">
      <button id="btnSearch" aria-label="찾기"></button>
      <button id="btnShelf" aria-label="책장 정리"></button>
      <button id="btnSettings" aria-label="설정"></button>
    </div>
  </header>

  <button id="btnBack">← 책장으로</button>

  <div id="emptyHint" hidden>
    <p class="eh-title">아직 꽂힌 책이 없어요</p>
    <p>아래 <b>＋ 책 꽂기</b>로 바코드를 찍어 첫 책을 꽂아보세요.</p>
  </div>

  <div id="today" hidden></div>
  <button id="todayBtn" type="button" aria-label="오늘의 한 줄" hidden>✨</button>
  <button id="fab">＋ 책 꽂기</button>

  <section id="bookPanel" hidden></section>
  <div id="bpActions" class="bp-actions"></div>
  <div id="sheetRoot"></div>
  <div id="toast" role="status"></div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
